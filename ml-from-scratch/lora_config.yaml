model: "Qwen/Qwen2.5-1.5B-Instruct"
train: true
data: "data"
seed: 42
lora_layers: 16
batch_size: 2
iters: 400
val_batches: -1
learning_rate: 2e-4
steps_per_report: 10
steps_per_eval: 50
save_every: 100
adapter_path: "adapters"
lora_parameters:
  rank: 16
  alpha: 32
  dropout: 0.05
  scale: 10.0
  keys: ["q_proj", "v_proj"]
